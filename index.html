
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Messenger</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.app {
    width: 100%;
    max-width: 1000px;
    height: 88vh;
    min-height: 450px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 20px 60px #263b6425;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: 270px;
    flex-shrink: 0;
    background: #f8faff;
    border-right: 1px solid #e7eaf0;
}

.brand {
    padding: 25px 20px;
    color: #087cff;
    font-size: 27px;
    font-weight: 800;
}

.search {
    margin: 0 15px 20px;
    width: calc(100% - 30px);
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #edf1f7;
    outline: none;
}

.contact {
    padding: 17px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #e7f0ff;
}

.avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #087cff, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 23px;
}

.contact-details {
    min-width: 0;
}

.contact-details strong {
    display: block;
    color: #202b3c;
}

.contact-details small {
    display: block;
    margin-top: 5px;
    color: #64748b;
}

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 17px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #edf0f5;
}

.header-info {
    flex: 1;
    min-width: 0;
}

.header-info strong {
    display: block;
    color: #202b3c;
    font-size: 17px;
}

#status {
    display: block;
    margin-top: 5px;
    color: #d97706;
    font-size: 12px;
}

#status.online {
    color: #16a34a;
}

#status.offline {
    color: #dc2626;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
}

.welcome {
    margin: auto;
    text-align: center;
    color: #64748b;
    line-height: 1.8;
}

.welcome .emoji {
    font-size: 48px;
    margin-bottom: 10px;
}

.message {
    max-width: 78%;
    align-self: flex-start;
}

.message.mine {
    align-self: flex-end;
}

.sender {
    font-size: 12px;
    color: #64748b;
    margin: 0 8px 5px;
}

.bubble {
    padding: 12px 16px;
    background: #edf1f7;
    color: #202b3c;
    border-radius: 18px 18px 18px 5px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    line-height: 1.5;
}

.mine .bubble {
    background: linear-gradient(135deg, #087cff, #5267f7);
    color: white;
    border-radius: 18px 18px 5px 18px;
}

.time {
    font-size: 11px;
    color: #94a3b8;
    margin: 5px 8px 0;
}

.notice {
    align-self: center;
    text-align: center;
    color: #b45309;
    background: #fffbeb;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12px;
}

.composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #edf0f5;
    background: white;
}

#messageInput {
    flex: 1;
    min-width: 0;
    height: 50px;
    padding: 0 18px;
    border: 2px solid transparent;
    outline: none;
    background: #f0f2f5;
    border-radius: 25px;
    font-size: 15px;
}

#messageInput:focus {
    border-color: #bfdbfe;
    background: #fff;
}

#sendButton {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #087cff;
    color: white;
    font-size: 23px;
    cursor: pointer;
    transition: 0.2s;
}

#sendButton:hover {
    background: #0757d8;
    transform: scale(1.04);
}

@media(max-width: 650px) {
    body {
        padding: 0;
    }

    .app {
        height: 100vh;
        min-height: 0;
        border-radius: 0;
    }

    .sidebar {
        display: none;
    }

    .messages {
        padding: 15px;
    }

    .composer {
        padding: 12px;
    }
}
</style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="brand">💬 Messenger</div>
        <input class="search" type="text"
               placeholder="Search messages..." disabled>

        <div class="contact">
            <div class="avatar">M</div>
            <div class="contact-details">
                <strong>General Chat</strong>
                <small>Messenger room</small>
            </div>
        </div>
    </aside>

    <main class="chat">
        <header class="header">
            <div class="avatar">M</div>
            <div class="header-info">
                <strong>Messenger Chat</strong>
                <span id="status">Connecting to server...</span>
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="emoji">💬</div>
                <h3>Welcome to Messenger!</h3>
                <p>Type a message below to start chatting.</p>
            </div>
        </section>

        <form class="composer" id="messageForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Enter a message..."
                autocomplete="off"
                maxlength="1000"
                aria-label="Enter a message"
            >
            <button id="sendButton" type="submit"
                    aria-label="Send message">➤</button>
        </form>
    </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const form = document.getElementById("messageForm");
const statusText = document.getElementById("status");

function showNotice(text) {
    const notice = document.createElement("div");
    notice.className = "notice";
    notice.textContent = text;
    messages.appendChild(notice);
    messages.scrollTop = messages.scrollHeight;
}

socket.on("connect", function() {
    statusText.textContent = "● Connected — Ready to chat";
    statusText.className = "online";
});

socket.on("disconnect", function() {
    statusText.textContent = "● Disconnected — check server";
    statusText.className = "offline";
});

socket.on("connect_error", function() {
    statusText.textContent = "● Cannot connect to server";
    statusText.className = "offline";
});

socket.on("chat message", function(data) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "message";

    if (data.id === socket.id) {
        wrapper.classList.add("mine");
    }

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = data.id === socket.id ? "You" : data.name;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = data.text;

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = data.time;

    wrapper.append(sender, bubble, time);
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
});

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();

    if (!text) {
        input.focus();
        return;
    }

    if (!socket.connected) {
        showNotice("Not connected. Your message was not sent. Check the server.");
        return;
    }

    socket.emit("chat message", text);
    input.value = "";
    input.focus();
});
</script>
</body>
</html>
